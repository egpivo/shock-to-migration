[workspace]
resolver = "2"
members = [
    "crates/shocktrace",
    "crates/shocktrace-cli",
]
default-members = [
    "crates/shocktrace",
    "crates/shocktrace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/placeholder/shock-to-migration"
rust-version = "1.75"

[workspace.dependencies]
shocktrace = { path = "crates/shocktrace" }
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
